name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          ZIP=$(ls *.zip | head -1)
          unzip -o "$ZIP" -d app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Pakete installieren
        working-directory: app
        run: npm install

      - name: Web-Dateien kopieren
        working-directory: app
        run: npx cap sync android

      - name: APK bauen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK bereitlegen
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/debug/app-debug.apk out/werkstatt.apk

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Werkstatt APK ${{ github.run_number }}
          files: out/werkstatt.apk
